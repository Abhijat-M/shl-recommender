# Render Blueprint for the SHL Recommender service.
#
# Free instance type means the service sleeps after ~15 min of idle and takes
# ~30-90 s to wake up. The SHL evaluator allows up to 2 minutes for the first
# /health call to succeed, which we honor.
#
# Deploy by connecting this repo on render.com -> "New from Blueprint".
# Set GEMINI_API_KEY as a secret in the Render dashboard before the first deploy.

services:
  - type: web
    name: shl-recommender
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false                    # set in dashboard, never committed
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-2.5-flash,gemini-2.0-flash,gemini-2.5-flash-lite
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_JSON
        value: "1"
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: PORT
        value: "10000"                 # Render's default for web services
      - key: HF_HOME
        value: /tmp/hf
